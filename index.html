<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Дневник питания</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5FA; --bg2:#EDEBF4; --card:#FFFFFF; --ink:#141221; --ink2:#8B889D; --line:#EDEBF3;
  --a1:#9F6BFF; --a2:#7C3AED; --aTint:#F1EAFF;
  --prot:#00BFA6; --fat:#FF9F0A; --carb:#7C5CFF; --water:#0FA3E0; --over:#E5335C;
  --shadow:0 10px 28px rgba(24,18,54,.07); --shadow-s:0 4px 14px rgba(24,18,54,.06);
}
html[data-pal="green"]{--a1:#B6E05A; --a2:#6DA82B; --aTint:#EEF7DF; --bg:#F5F5F5; --bg2:#EAEDE4}
html[data-pal="sunset"]{--a1:#FFA35B; --a2:#F0345F; --aTint:#FFEBEE; --bg:#F8F5F4; --bg2:#F1E8E6}
html[data-theme="dark"]{
  --bg:#0F0E16; --bg2:#1E1C2B; --card:#1A1826; --ink:#F7F6FB; --ink2:#918FA6; --line:#2A2838;
  --aTint:#241C3D; --over:#FF5C7A;
  --shadow:0 16px 34px rgba(0,0,0,.5); --shadow-s:0 6px 16px rgba(0,0,0,.38);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;
  padding-bottom:112px;transition:background .2s,color .2s}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.035em}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:18px 18px 8px}
.muted{color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--ink2)}

/* шапка */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:18px}
.title2{font-size:28px;line-height:1.08;letter-spacing:-.045em;font-weight:800}
.title2 em{font-style:normal;color:var(--a2)}
.dnav{display:flex;align-items:center;gap:8px}
.icb{width:42px;height:42px;border:0;border-radius:50%;background:var(--card);color:var(--ink);
  box-shadow:var(--shadow-s);display:grid;place-items:center;font-size:17px;font-weight:800;cursor:pointer}
.icb:active{transform:scale(.93)}
.dsub{font-size:12px;color:var(--ink2);font-weight:600}

/* баннер как промо-блок в референсе */
.banner{background:var(--aTint);border-radius:28px;padding:20px;margin-bottom:6px;
  display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.banner.warn{background:linear-gradient(135deg,#FFE3E8,#FFD4DE)}
html[data-theme="dark"] .banner.warn{background:#3A1B2A}
.bcopy{flex:1;min-width:0}
.badge{display:inline-block;background:var(--ink);color:var(--bg);border-radius:999px;
  padding:5px 12px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.bnum{font-size:42px;font-weight:800;letter-spacing:-.05em;line-height:1.1;margin:10px 0 2px}
.bnum small{font-size:15px;font-weight:800;letter-spacing:-.02em}
.bsub{font-size:12px;color:var(--ink2);font-weight:700;margin-bottom:14px}
.cta{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:13px 20px;
  font-weight:800;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.cta:active{transform:scale(.97)}
.ringmini{width:120px;height:120px;flex:none}
.ringmini circle{fill:none;stroke-linecap:round}
.rbg{stroke:rgba(124,58,237,.14);stroke-width:12}
html[data-theme="dark"] .rbg{stroke:rgba(255,255,255,.12)}
.rfg{stroke:var(--a2);stroke-width:12;transition:stroke-dashoffset .5s ease}

/* круглые категории */
.sechead{display:flex;align-items:center;justify-content:space-between;margin:22px 3px 12px}
.sechead h2{font-size:18px}
.link{border:0;background:none;color:var(--a2);font-weight:800;font-size:12px;cursor:pointer;padding:4px;
  letter-spacing:.08em;text-transform:uppercase}
.cats{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:76px;border:0;background:none;padding:0;cursor:pointer;text-align:center}
.cat .ic{width:62px;height:62px;margin:0 auto;border-radius:50%;display:grid;place-items:center;
  font-size:24px;background:var(--card);box-shadow:var(--shadow-s)}
.cat:active .ic{transform:scale(.94)}
.cat.on .ic{background:var(--a2);color:#fff;box-shadow:0 8px 18px rgba(60,30,120,.26)}
.cat.on small{color:var(--a2)}
.cat small{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;
  color:var(--ink2);margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat b{display:block;font-size:12.5px;font-weight:800;margin-top:1px}

.card{background:var(--card);border-radius:26px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card.tight{padding:16px}

/* БЖУ как блок NOTES */
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.note .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:15px;margin-bottom:8px}
.note .lab{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ink2)}
.note b{display:block;font-size:16px;font-weight:800;letter-spacing:-.03em;margin:2px 0 7px}
.bar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden}
.bar span{display:block;height:100%;border-radius:6px;transition:width .4s ease}

/* степпер количества */
.stepper{display:flex;align-items:center;gap:2px;background:var(--bg2);border-radius:999px;padding:5px}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:var(--card);
  font-size:19px;font-weight:800;cursor:pointer;box-shadow:var(--shadow-s);line-height:1}
.stepper button:active{transform:scale(.92)}
.stepper .val{min-width:62px;text-align:center;font-weight:800;font-size:15px}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrow b{font-size:19px;font-weight:800;letter-spacing:-.03em}
.glasses{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.gl{width:30px;height:37px;border:0;border-radius:9px 9px 14px 14px;background:var(--bg2);cursor:pointer;
  transition:background .15s,transform .1s;color:var(--ink2);font-weight:800}
.gl.on{background:linear-gradient(180deg,#5AD3FF,var(--water))}
.gl:active{transform:scale(.9)}

/* приёмы пищи */
.meal{margin-bottom:18px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 3px}
.mname{font-weight:800;font-size:16px;display:flex;align-items:center;gap:9px;letter-spacing:-.025em}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.mkcal{font-size:11.5px;font-weight:800;padding:6px 12px;border-radius:999px}
.right{display:flex;align-items:center;gap:8px}
.mini{width:32px;height:32px;border:0;border-radius:50%;background:var(--card);color:var(--ink2);
  box-shadow:var(--shadow-s);font-size:15px;cursor:pointer;line-height:1}
.mini:active{transform:scale(.92)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;background:var(--card);
  box-shadow:var(--shadow-s);margin-bottom:9px;cursor:pointer}
.ith{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:20px;flex:none}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm span{font-size:11px;color:var(--ink2);font-weight:700;letter-spacing:.03em}
.item .kk{font-weight:800;font-size:16px;letter-spacing:-.03em}
.addbtn{width:100%;border:2px dashed var(--line);background:transparent;color:var(--ink2);
  border-radius:999px;padding:14px;font-weight:800;font-size:13.5px;cursor:pointer}
.addbtn:active{background:var(--bg2)}
.sublabel{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--ink2);margin:18px 3px 9px}

/* плитки каталога */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{background:var(--card);border-radius:24px;padding:12px;box-shadow:var(--shadow-s);cursor:pointer;
  position:relative;display:flex;flex-direction:column}
.gcard:active{transform:scale(.985)}
.thumb{height:82px;border-radius:18px;display:grid;place-items:center;font-size:30px;margin-bottom:11px}
.gcard .gname{font-size:13.5px;font-weight:800;line-height:1.25;letter-spacing:-.02em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.gcard .gcat{font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ink2);margin:5px 0 8px}
.gcard .gk{font-size:17px;font-weight:800;color:var(--a2);letter-spacing:-.03em}
.gcard .gk small{font-size:10.5px;color:var(--ink2);font-weight:800;letter-spacing:0}
.fav{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;border:0;
  background:rgba(255,255,255,.9);color:var(--ink2);font-size:13px;cursor:pointer;box-shadow:var(--shadow-s)}
html[data-theme="dark"] .fav{background:rgba(20,18,32,.75)}

.btn{border:0;border-radius:999px;padding:17px 20px;font-weight:800;cursor:pointer;width:100%;
  background:var(--a2);color:#fff;box-shadow:0 12px 24px rgba(60,30,120,.22);font-size:15px}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow-s)}
.btn.warn{background:var(--card);color:var(--over);box-shadow:var(--shadow-s)}
.btn.sm{padding:13px 16px;font-size:13.5px}
.btn.dark{background:var(--ink);color:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

.input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:18px;
  padding:14px 16px;outline:none;font-weight:700}
.input:focus{border-color:var(--a2)}
.field{margin-bottom:12px}
.field label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:800;color:var(--ink2);margin:0 0 7px 4px}
.search{position:relative;margin-bottom:4px}
.search .ico{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--ink2);font-size:17px}
.search .input{padding-left:46px;border-radius:999px;box-shadow:var(--shadow-s);border-color:transparent}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);color:var(--ink2);border-radius:999px;padding:10px 16px;
  font-weight:800;font-size:12.5px;box-shadow:var(--shadow-s);cursor:pointer}
.chip.on{background:var(--a2);color:#fff;box-shadow:0 8px 18px rgba(60,30,120,.24)}

/* плавающее меню */
.tabs{position:fixed;left:18px;right:18px;bottom:calc(14px + env(safe-area-inset-bottom));
  max-width:484px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;
  background:var(--card);border-radius:999px;padding:8px;z-index:40;box-shadow:0 14px 34px rgba(24,18,54,.15)}
.tab{border:0;background:none;padding:11px 14px;border-radius:999px;cursor:pointer;
  display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--ink2);white-space:nowrap}
.tab i{font-style:normal;font-size:19px;line-height:1}
.tab span{display:none}
.tab.on{background:var(--a2);color:#fff}
.tab.on span{display:inline}

.swrap{position:fixed;inset:0;background:rgba(14,10,32,.45);backdrop-filter:blur(4px);
  z-index:60;display:none;align-items:flex-end;justify-content:center}
.swrap.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  border-radius:32px 32px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:44px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.shead h3{font-size:20px}
.close{border:0;background:var(--bg2);border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer;color:var(--ink2)}
.list{max-height:44vh;overflow-y:auto;margin:4px -4px 0;padding:0 4px}
.pick{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--card);
  box-shadow:var(--shadow-s);margin-bottom:8px;cursor:pointer}
.pick .nm{flex:1;min-width:0}
.pick .nm b{display:block;font-size:14px;font-weight:700}
.pick .nm span{font-size:11px;color:var(--ink2);font-weight:700;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;letter-spacing:.02em}
.pick .kk{font-weight:800;font-size:14px;white-space:nowrap;color:var(--a2)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;
  display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.pick.sel{box-shadow:0 0 0 2px var(--a2),var(--shadow-s)}
.pick.sel .chk{background:var(--a2);border-color:var(--a2)}
.mbar{position:sticky;bottom:0;padding:10px 0 2px;background:linear-gradient(180deg,transparent,var(--bg) 35%)}
.ginput{width:96px;padding:12px 10px;text-align:center;border-radius:16px}
.empty{text-align:center;color:var(--ink2);font-size:13.5px;padding:26px 10px;font-weight:600}

/* экран продукта */
.dhero{background:var(--aTint);border-radius:26px;height:150px;display:grid;place-items:center;
  font-size:62px;margin-bottom:16px}
.dtitle{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.dtitle h3{font-size:21px;line-height:1.15}
.dprice{font-size:24px;font-weight:800;color:var(--a2);letter-spacing:-.04em;white-space:nowrap}
.dprice small{display:block;font-size:10px;color:var(--ink2);letter-spacing:.1em;text-transform:uppercase;text-align:right}
.hr{height:1px;background:var(--line);margin:16px 0}

.stat{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.sbox{background:var(--card);border-radius:24px;padding:17px;box-shadow:var(--shadow-s)}
.sbox b{display:block;font-size:25px;font-weight:800;letter-spacing:-.04em;color:var(--a2)}
.sbox span{font-size:9.5px;color:var(--ink2);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.chart{display:flex;align-items:flex-end;gap:5px;margin-top:8px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.track{width:100%;height:140px;display:flex;align-items:flex-end}
.colbar{width:100%;border-radius:12px;background:var(--a2);min-height:4px}
.colbar.over{background:var(--over)}
.colbar.zero{background:var(--bg2)}
.col small{font-size:9.5px;color:var(--ink2);font-weight:800}
.eaten .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.eaten .row + .row{border-top:1px solid var(--line)}
.tline{display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600}
.tline:last-child{border:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:112px;background:var(--ink);color:var(--bg);
  padding:13px 22px;border-radius:999px;font-weight:800;font-size:13.5px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:80;box-shadow:0 12px 26px rgba(24,18,54,.3)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
textarea.input{min-height:110px;font-size:12px;font-weight:500;font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top"></div>
  <div id="view"></div>
</div>

<nav class="tabs">
  <button class="tab" data-t="diary"><i>◎</i><span>Дневник</span></button>
  <button class="tab" data-t="food"><i>☰</i><span>Еда</span></button>
  <button class="tab" data-t="report"><i>▥</i><span>Отчёт</span></button>
  <button class="tab" data-t="set"><i>⚙</i><span>Настройки</span></button>
</nav>

<div class="swrap" id="swrap"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

  v:1,

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT));
    const s = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEFAULT)), s,
      { settings: Object.assign({}, DEFAULT.settings, s.settings||{}) });
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT)); }
}
let cloudTimer = null;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('Не удалось сохранить'); }
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(cloudBackup, 4000);
}

/* резервная копия в облако Telegram (значение ключа ограничено, поэтому режем на части) */
function cloudBackup(cb){
  if(!CLOUD) { cb && cb(false); return; }
  try{
  const s = JSON.stringify(state), parts = [];
  for(let i=0;i<s.length;i+=3000) parts.push(s.slice(i,i+3000));
  if(parts.length>200){ cb && cb(false); return; }
  let done = 0, fail = false;
  tg.CloudStorage.setItem('bk_meta', String(parts.length), ()=>{});
  parts.forEach((p,i)=>tg.CloudStorage.setItem('bk_'+i, p, (err)=>{
    if(err) fail = true;
    if(++done===parts.length && cb) cb(!fail);
  }));
  }catch(e){ cb && cb(false); }
}
function cloudRestore(silent){
  if(!CLOUD) { if(!silent) toast('Облако Telegram недоступно'); return; }
  try{
  tg.CloudStorage.getItem('bk_meta',(e,v)=>{
    const n = parseInt(v||'0',10);
    if(!n){ if(!silent) toast('Копии в облаке нет'); return; }
    const keys = []; for(let i=0;i<n;i++) keys.push('bk_'+i);
    tg.CloudStorage.getItems(keys,(er,obj)=>{
      if(er||!obj){ if(!silent) toast('Не удалось прочитать копию'); return; }
      let s=''; for(let i=0;i<n;i++) s += (obj['bk_'+i]||'');
      try{ state = JSON.parse(s); save(); applyTheme(); render(); toast('Данные восстановлены'); }
      catch(x){ if(!silent) toast('Копия повреждена'); }
    });
  });
  }catch(e){ if(!silent) toast('Облако недоступно'); }
}

function getDay(k, create){
  if(!state.days[k]){
    const d = { meals: state.settings.meals.map(n=>({name:n, items:[]})), water:0 };
    if(create){ state.days[k] = d; return state.days[k]; }
    return d;
  }
  return state.days[k];
}
function totals(day){
  const t = {k:0,p:0,f:0,c:0};
  day.meals.forEach(m=>m.items.forEach(i=>{
    const q = i.g/100;
    t.k += i.k*q; t.p += i.p*q; t.f += i.f*q; t.c += i.c*q;
  }));
  return t;
}
function mealKcal(m){ return m.items.reduce((s,i)=>s+i.k*i.g/100,0); }

  <div class="sechead"><h2>Приёмы</h2><button class="link" id="copyDay">Повторить день</button></div>

function bindDiary(){
  document.getElementById('prev').onclick = ()=>{ cur.setDate(cur.getDate()-1); render(); };
  document.getElementById('next').onclick = ()=>{ cur.setDate(cur.getDate()+1); render(); };
  document.getElementById('today').onclick = ()=>{ cur = new Date(); cur.setHours(12,0,0,0); render(); };
  const k = keyOf(cur);
  document.querySelectorAll('.gl[data-w]').forEach(b=>b.onclick=()=>{
    const d = getDay(k,true), n = +b.dataset.w;
    d.water = (d.water===n) ? n-1 : n;
    haptic(); save(); render();
  });
  document.querySelectorAll('[data-wd]').forEach(b=>b.onclick=()=>{
    const d = getDay(k,true);
    d.water = Math.max(0, (d.water||0) + (b.dataset.wd==='+'?1:-1));
    haptic(); save(); render();
  });
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openPicker(+b.dataset.add));
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>openPicker(+b.dataset.cat));
  document.getElementById('quickAdd').onclick = ()=>openPicker(0);
  document.querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>openRepeat(+b.dataset.rep));
  document.getElementById('copyDay').onclick = openCopyDay;
  document.querySelectorAll('.item').forEach(el=>el.onclick=()=>openAmount(null,+el.dataset.m,{m:+el.dataset.m,i:+el.dataset.i}));
  document.getElementById('addMeal').onclick = ()=>{
    sheet(`<div class="shead"><h3>Новый приём пищи</h3><button class="close" data-x>✕</button></div>
      <div class="field"><label>Название</label><input class="input" id="mn" placeholder="Второй перекус"></div>
      <button class="btn" id="ok">Добавить</button>`);
    document.getElementById('ok').onclick = ()=>{
      const n = document.getElementById('mn').value.trim();
      if(!n) return;
      getDay(k,true).meals.push({name:n, items:[]});
      save(); closeSheet(); render();
    };
  };
}

/* ---------- Повторы и шаблоны ---------- */
function dLabel(k){ const a = k.split('-').map(Number); return a[2]+' '+MON[a[1]-1]; }
function itemsKcal(items){ return items.reduce((s,i)=>s+i.k*i.g/100,0); }
function itemsLine(items){ return items.map(i=>i.n).join(', '); }

function pastMeals(name, limit){
  const out = [], curK = keyOf(cur);
  Object.keys(state.days).filter(k=>k<curK).sort().reverse().forEach(k=>{
    if(out.length>=(limit||8)) return;
    state.days[k].meals.forEach(m=>{
      if(m.name===name && m.items.length && out.length<(limit||8)) out.push({k, items:m.items});
    });
  });
  return out;
}
function addItemsTo(mi, items){
  const d = getDay(keyOf(cur), true);
  items.forEach(i=>{
    d.meals[mi].items.push(Object.assign({}, i, {id:uid()}));
    state.freq[i.n] = (state.freq[i.n]||0)+1;
  });
  haptic('medium'); save(); closeSheet(); render();
  toast('Добавлено: '+items.length+' поз.');
}

function openRepeat(mi){
  const meal = getDay(keyOf(cur)).meals[mi];
  const past = pastMeals(meal.name, 8);
  const tpl = state.templates||[];
  const card = (title, sub, attr) =>
    `<div class="pick" ${attr}><div class="nm"><b>${title}</b><span>${sub}</span></div><div class="kk">+</div></div>`;

  sheet(`<div class="shead"><h3>Повторить: ${meal.name}</h3><button class="close" data-x>✕</button></div>
    <div class="dsub" style="margin:-6px 0 4px">Еда добавится к тому, что уже есть в этом приёме.</div>

    <div class="sublabel">Из прошлых дней</div>
    ${past.length ? past.map((p,ix)=>card(dLabel(p.k)+' · '+Math.round(itemsKcal(p.items))+' ккал',
        itemsLine(p.items), `data-p="${ix}"`)).join('')
      : '<div class="empty">Тут появятся твои прошлые завтраки, обеды и ужины.</div>'}

    <div class="sublabel">Мои шаблоны</div>
    ${tpl.length ? tpl.map((t,ix)=>`<div class="pick" data-tpl="${ix}">
        <div class="nm"><b>${t.n} · ${Math.round(itemsKcal(t.items))} ккал</b><span>${itemsLine(t.items)}</span></div>
        <div class="kk" data-tdel="${ix}" style="color:var(--over);padding:0 6px">✕</div></div>`).join('')
      : '<div class="empty">Сохрани сюда то, что ешь постоянно — например «мой обычный завтрак».</div>'}

    ${meal.items.length ? `<button class="btn ghost sm" id="saveTpl" style="margin-top:14px">
        Сохранить этот приём как шаблон</button>` : ''}`);

  document.querySelectorAll('#sheet [data-p]').forEach(el=>el.onclick=()=>addItemsTo(mi, past[+el.dataset.p].items));
  document.querySelectorAll('#sheet [data-tpl]').forEach(el=>el.onclick=()=>addItemsTo(mi, tpl[+el.dataset.tpl].items));
  document.querySelectorAll('#sheet [data-tdel]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    state.templates.splice(+el.dataset.tdel,1); save(); closeSheet(); openRepeat(mi);
  });
  const st = document.getElementById('saveTpl');
  if(st) st.onclick = ()=>{
    sheet(`<div class="shead"><h3>Новый шаблон</h3><button class="close" data-x>✕</button></div>
      <div class="dsub" style="margin:-6px 0 12px">${itemsLine(meal.items)}</div>
      <div class="field"><label>Название</label><input class="input" id="tn" value="${meal.name}"></div>
      <button class="btn" id="ok">Сохранить шаблон</button>`);
    document.getElementById('ok').onclick = ()=>{
      const n = document.getElementById('tn').value.trim();
      if(!n){ toast('Нужно название'); return; }
      state.templates.unshift({id:uid(), n, items: meal.items.map(i=>Object.assign({},i))});
      save(); closeSheet(); toast('Шаблон сохранён');
    };
  };
}

function openCopyDay(){
  const curK = keyOf(cur);
  const days = Object.keys(state.days).filter(k=>{
    if(k===curK) return false;
    return state.days[k].meals.some(m=>m.items.length);
  }).sort().reverse().slice(0,10);

  sheet(`<div class="shead"><h3>Повторить целый день</h3><button class="close" data-x>✕</button></div>
    <div class="dsub" style="margin:-6px 0 10px">Вся еда выбранного дня добавится к текущему. Вода не копируется.</div>
    ${days.length ? days.map(k=>{
      const d = state.days[k], kk = d.meals.reduce((s,m)=>s+mealKcal(m),0);
      return `<div class="pick" data-k="${k}"><div class="nm"><b>${dLabel(k)} · ${Math.round(kk)} ккал</b>
        <span>${d.meals.filter(m=>m.items.length).map(m=>m.name).join(', ')}</span></div><div class="kk">+</div></div>`;
    }).join('') : '<div class="empty">Пока не из чего копировать — заполни хотя бы один день.</div>'}`);

  document.querySelectorAll('#sheet [data-k]').forEach(el=>el.onclick=()=>{
    const src = state.days[el.dataset.k], day = getDay(curK, true);
    let n = 0;
    src.meals.forEach(m=>{
      if(!m.items.length) return;
      let target = day.meals.find(x=>x.name===m.name);
      if(!target){ target = {name:m.name, items:[]}; day.meals.push(target); }
      m.items.forEach(i=>{ target.items.push(Object.assign({}, i, {id:uid()})); n++; });
    });
    haptic('medium'); save(); closeSheet(); render(); toast('День повторён: '+n+' поз.');
  });
}

/* ---------- Выбор продукта ---------- */
let pickSrc = 'freq', pickQuery = '', pickMeal = 0, pickMode = 'day', dishDraft = null;
let multi = false, sel = [];

function allProducts(){
  const out = [];
  DB.forEach(p=>{
    if((state.hidden||[]).includes(p.n)) return;
    const e = (state.edits||{})[p.n];
    out.push(e ? Object.assign({}, p, e, {_o:p.n, edited:true}) : Object.assign({}, p, {_o:p.n}));
  });
  (state.custom||[]).forEach((c,i)=>out.push(Object.assign({}, c, {cat:'Мои продукты', my:true, ci:i})));
  return out;
}
function freqList(){
  const arr = (state.recent||[]).slice();
  arr.sort((a,b)=>(state.freq[b.n]||0)-(state.freq[a.n]||0));
  return arr.slice(0,40);
}
function openPicker(mealIdx, mode){
  pickMeal = mealIdx; pickMode = mode || 'day'; pickQuery=''; pickSrc = freqList().length?'freq':'base';
  multi = false; sel = [];
  sheet(`<div class="shead"><h3>${pickMode==='dish'?'Ингредиент':'Добавить еду'}</h3><button class="close" data-x>✕</button></div>
    <div class="search"><span class="ico">⌕</span>
      <input class="input" id="q" placeholder="Найти: творог, гречка, банан…" autocomplete="off"></div>
    <div class="chips" id="src" style="margin-top:10px">
      <button class="chip" data-s="freq">Частое</button>
      <button class="chip" data-s="base">База</button>
      <button class="chip" data-s="my">Мои продукты</button>
      ${pickMode==='dish'?'':'<button class="chip" data-s="dish">Мои блюда</button>'}
    </div>
    ${pickMode==='dish'?'':'<button class="chip" id="multiTgl" style="margin-bottom:6px">☑ Выбрать несколько</button>'}
    <div class="list" id="plist"></div>
    <div class="mbar" id="mbar"></div>
    ${pickMode==='dish'?'':'<button class="btn ghost sm" id="newProd" style="margin-top:10px">+ Создать свой продукт</button>'}`);
  const q = document.getElementById('q');
  q.oninput = ()=>{ pickQuery = q.value.trim().toLowerCase(); if(pickQuery) pickSrc='base'; drawPick(); };
  document.querySelectorAll('#src .chip').forEach(b=>b.onclick=()=>{ pickSrc=b.dataset.s; drawPick(); });
  const np = document.getElementById('newProd');
  if(np) np.onclick = ()=>openProductForm();
  const mt = document.getElementById('multiTgl');
  if(mt) mt.onclick = ()=>{
    multi = !multi; sel = [];
    mt.classList.toggle('on', multi);
    mt.textContent = multi ? '☑ Обычный режим' : '☑ Выбрать несколько';
    drawPick();
  };
  drawPick();
}
function drawPick(){
  document.querySelectorAll('#src .chip').forEach(b=>b.classList.toggle('on', b.dataset.s===pickSrc));
  const box = document.getElementById('plist');
  let items = [];
  if(pickSrc==='dish'){
    items = state.dishes.map(d=>({n:d.n, k:d.k, p:d.p, f:d.f, c:d.c, cat:'Моё блюдо', dish:d}));
  } else if(pickSrc==='my'){
    items = allProducts().filter(p=>p.my);
  } else if(pickSrc==='freq' && !pickQuery){
    items = freqList();
  } else {
    items = allProducts();
  }
  if(pickQuery){
    if(pickSrc!=='dish') items = allProducts().concat(state.dishes.map(d=>({n:d.n,k:d.k,p:d.p,f:d.f,c:d.c,cat:'Моё блюдо',dish:d})));
    items = items.filter(i=>i.n.toLowerCase().includes(pickQuery));
    items.sort((a,b)=>a.n.toLowerCase().indexOf(pickQuery)-b.n.toLowerCase().indexOf(pickQuery));
  }
  items = items.slice(0,90);
  if(!items.length){
    box.innerHTML = `<div class="empty">${pickSrc==='freq'?'Здесь появится то, что ты ешь чаще всего.':'Ничего не нашлось. Можно создать свой продукт.'}</div>`;
    return;
  }
  box.innerHTML = items.map((it,ix)=>{
    const on = multi && sel.some(s=>s.n===it.n);
    return `
    <div class="pick ${on?'sel':''}" data-ix="${ix}">
      ${multi?`<div class="chk">${on?'✓':''}</div>`:''}
      <div class="nm"><b>${it.n}</b><span class="num">${it.cat||''} · ${it.dish
        ? 'порция '+it.dish.g+' г · '+Math.round(it.dish.k*it.dish.g/100)+' ккал'
        : Math.round(it.k)+' ккал / 100 г'}</span></div>
      <div class="kk num">Б${r1(it.p)} Ж${r1(it.f)} У${r1(it.c)}</div>
    </div>`;
  }).join('');
  box.querySelectorAll('.pick').forEach(el=>el.onclick=()=>{
    const it = items[+el.dataset.ix];
    if(!multi){ openAmount(it, pickMeal, null); return; }
    const at = sel.findIndex(s=>s.n===it.n);
    if(at>=0) sel.splice(at,1); else sel.push(it);
    haptic(); drawPick();
  });
  drawMBar();
}
function drawMBar(){
  const bar = document.getElementById('mbar');
  if(!bar) return;
  if(!multi){ bar.innerHTML = ''; return; }
  bar.innerHTML = sel.length
    ? `<button class="btn" id="goAmt">Дальше · выбрано ${sel.length}</button>`
    : `<div class="dsub" style="text-align:center;padding:8px 0">Отмечай всё, что съела — граммы проставишь одним экраном.</div>`;
  const g = document.getElementById('goAmt');
  if(g) g.onclick = ()=>openMultiAmounts(pickMeal);
}

/* ---------- Граммы для нескольких продуктов сразу ---------- */
function openMultiAmounts(mealIdx){
  const meal = getDay(keyOf(cur)).meals[mealIdx];
  const gOf = p => p.pg || (p.dish ? p.dish.g : 100);
  sheet(`<div class="shead"><h3>Сколько чего</h3><button class="close" data-x>✕</button></div>
    <div class="dsub" style="margin:-6px 0 12px">Всё уйдёт в приём «${meal.name}». Лишнее убери крестиком.</div>
    <div id="mrows">
      ${sel.map((p,i)=>`
        <div class="pick" style="align-items:center">
          <div class="nm"><b>${p.n}</b><span class="num" id="mk_${i}"></span></div>
          <input class="input num ginput" id="mg_${i}" type="number" inputmode="decimal" value="${gOf(p)}">
          <div class="kk" data-mrm="${i}" style="color:var(--over);padding:0 4px">✕</div>
        </div>`).join('')}
    </div>
    <div class="card tight" style="margin-top:12px"><div class="eaten">
      <div class="row" style="display:flex;justify-content:space-between"><span class="muted">Итого</span><b class="num" id="mtot">—</b></div>
    </div></div>
    <button class="btn" id="okAll" style="margin-top:12px">Добавить ${sel.length} поз. в «${meal.name}»</button>`);

  const recalc = ()=>{
    let k=0,p=0,f=0,c=0;
    sel.forEach((it,i)=>{
      const g = parseFloat(document.getElementById('mg_'+i).value)||0, q = g/100;
      k += it.k*q; p += it.p*q; f += it.f*q; c += it.c*q;
      document.getElementById('mk_'+i).textContent = Math.round(it.k*q)+' ккал';
    });
    document.getElementById('mtot').textContent =
      Math.round(k)+' ккал · Б '+r1(p)+' / Ж '+r1(f)+' / У '+r1(c);
  };
  sel.forEach((p,i)=>{ document.getElementById('mg_'+i).oninput = recalc; });
  recalc();

  document.querySelectorAll('#sheet [data-mrm]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    sel.splice(+el.dataset.mrm,1);
    if(!sel.length){ closeSheet(); toast('Ничего не выбрано'); return; }
    openMultiAmounts(mealIdx);
  });

  document.getElementById('okAll').onclick = ()=>{
    const day = getDay(keyOf(cur), true);
    let n = 0;
    sel.forEach((it,i)=>{
      const g = parseFloat(document.getElementById('mg_'+i).value)||0;
      if(g<=0) return;
      day.meals[mealIdx].items.push({id:uid(), n:it.n, g, k:it.k, p:it.p, f:it.f, c:it.c, cat:it.cat||''});
      state.freq[it.n] = (state.freq[it.n]||0)+1;
      state.recent = [{n:it.n,k:it.k,p:it.p,f:it.f,c:it.c,cat:it.cat||''}]
        .concat((state.recent||[]).filter(r=>r.n!==it.n)).slice(0,60);
      n++;
    });
    if(!n){ toast('Укажи граммы'); return; }
    sel = []; multi = false;
    haptic('medium'); save(); closeSheet(); render(); toast('Добавлено: '+n+' поз.');
  };
}

/* ---------- Карточка продукта: вес и добавление ---------- */
function openAmount(prod, mealIdx, edit){
  const k = keyOf(cur);
  let base = prod, g = 100;
  if(edit){
    const it = getDay(k,true).meals[edit.m].items[edit.i];
    base = {n:it.n,k:it.k,p:it.p,f:it.f,c:it.c,cat:it.cat||''}; g = it.g;
  } else if(prod.pg) g = prod.pg;
  else if(prod.dish) g = prod.dish.g;

  const chips = [];
  if(prod && prod.pg) chips.push([prod.pg, prod.pn+' '+prod.pg+' г']);
  if(prod && prod.dish) chips.push([prod.dish.g, 'вся порция '+prod.dish.g+' г']);
  [50,100,150,200,250].forEach(v=>chips.push([v, v+' г']));
  const mealName = (getDay(k).meals[mealIdx]||{}).name || 'приём';

  const note = (lab,val,color,ic)=>`<div class="note">
      <div class="ic" style="background:${color}1F;color:${color}">${ic}</div>
      <div class="lab">${lab}</div><b class="num">${r1(val)} г</b></div>`;

  sheet(`<div class="shead"><h3></h3><button class="close" data-x>✕</button></div>
    <div class="dhero">${catIcon(base.cat)}</div>
    <div class="dtitle">
      <div><div class="eyebrow" style="margin-bottom:5px">${base.cat||'продукт'}</div><h3>${base.n}</h3></div>
      <div class="dprice num">${Math.round(base.k)}<small>ккал / 100 г</small></div>
    </div>
    <div class="hr"></div>
    <div class="eyebrow" style="margin-bottom:10px">В 100 граммах</div>
    <div class="notes">
      ${note('Белки',base.p,'#00BFA6','🥩')}
      ${note('Жиры',base.f,'#FF9F0A','🥑')}
      ${note('Углеводы',base.c,'#7C5CFF','🌾')}
    </div>
    <div class="hr"></div>
    <div class="wrow" style="margin-bottom:12px">
      <div><div class="eyebrow">Вес</div><b class="num" id="gLabel">${g} г</b></div>
      <div class="stepper">
        <button id="gm">−</button>
        <input class="input num" id="g" type="number" inputmode="decimal" value="${g}"
          style="width:84px;border:0;background:none;box-shadow:none;text-align:center;padding:8px 0">
        <button id="gp">+</button>
      </div>
    </div>
    <div class="chips">${chips.map(c=>`<button class="chip" data-g="${c[0]}">${c[1]}</button>`).join('')}</div>
    <div class="card tight" id="prev" style="margin-bottom:14px"></div>

    ${edit?'<button class="btn warn sm" id="del" style="margin-top:10px">Удалить запись</button>':''}`);

  const gi = document.getElementById('g');
  const upd = ()=>{
    const gv = parseFloat(gi.value)||0, q = gv/100;
    document.getElementById('gLabel').textContent = Math.round(gv)+' г';
    document.getElementById('prev').innerHTML =
      `<div class="wrow"><div><div class="eyebrow">Итого</div>
        <b class="num" style="font-size:26px;color:var(--a2)">${Math.round(base.k*q)} ккал</b></div>
       <div style="text-align:right"><div class="eyebrow">Б / Ж / У</div>
        <b class="num">${r1(base.p*q)} / ${r1(base.f*q)} / ${r1(base.c*q)}</b></div></div>`;
  };
  gi.oninput = upd; upd();
  document.getElementById('gm').onclick = ()=>{ gi.value = Math.max(0,(parseFloat(gi.value)||0)-10); upd(); };
  document.getElementById('gp').onclick = ()=>{ gi.value = (parseFloat(gi.value)||0)+10; upd(); };
  document.querySelectorAll('#sheet .chip[data-g]').forEach(b=>b.onclick=()=>{ gi.value = b.dataset.g; upd(); });

  document.getElementById('ok').onclick = ()=>{
    const gv = parseFloat(gi.value)||0;
    if(gv<=0){ toast('Укажи граммы'); return; }
    if(pickMode==='dish' && !edit){
      dishDraft.ing = dishDraft.ing || [];
      dishDraft.ing.push({n:base.n,g:gv,k:base.k,p:base.p,f:base.f,c:base.c});
      closeSheet(); openDishIngredients(); return;
    }
    const day = getDay(k,true);
    if(edit){ Object.assign(day.meals[edit.m].items[edit.i], {g:gv}); }
    else{
      day.meals[mealIdx].items.push({id:uid(), n:base.n, g:gv, k:base.k, p:base.p, f:base.f, c:base.c, cat:base.cat||''});
      state.freq[base.n] = (state.freq[base.n]||0)+1;
      state.recent = [{n:base.n,k:base.k,p:base.p,f:base.f,c:base.c,cat:base.cat||''}]
        .concat((state.recent||[]).filter(r=>r.n!==base.n)).slice(0,60);
    }
    haptic('medium'); save(); closeSheet(); render();
  };
  const del = document.getElementById('del');
  if(del) del.onclick = ()=>{
    getDay(k,true).meals[edit.m].items.splice(edit.i,1);
    save(); closeSheet(); render();
  };
}

/* ---------- Экран «Еда»: каталог плитками ---------- */

function catEmoji(c){
  if(c==='Все') return '🍽';

}
function viewFood(){

  return `

  <div class="sechead"><h2>Категории</h2><button class="link" id="np">+ продукт</button></div>
  <div class="cats" id="fcats">

      <span class="ic">${catEmoji(c)}</span><small>${c==='Мои продукты'?'Мои':c==='Мои блюда'?'Блюда':c}</small>

function drawFood(){
  let items;
  if(foodCat==='Мои блюда') items = state.dishes.map(d=>({n:d.n,k:d.k,p:d.p,f:d.f,c:d.c,
    cat:'Моё блюдо · порция '+d.g+' г · '+Math.round(d.k*d.g/100)+' ккал', dish:d}));
  else if(foodCat==='Мои продукты') items = allProducts().filter(p=>p.my);
  else items = allProducts().filter(p=>foodCat==='Все'||p.cat===foodCat);
  const q = foodQ.trim().toLowerCase();
  if(q) items = items.filter(i=>i.n.toLowerCase().includes(q));
  items = items.slice(0,120);

  document.getElementById('flist').innerHTML = items.length ? items.map((it,ix)=>`
    <div class="gcard" data-ix="${ix}">
      <div class="thumb" style="background:var(--aTint)">${catIcon(it.cat)}</div>
      <button class="fav" data-ed="${ix}" title="Изменить">✎</button>
      <div class="gname">${it.n}${it.edited?' <span style="color:var(--a2)">·</span>':''}</div>
      <div class="gcat">${it.dish?('порция '+it.dish.g+' г'):(it.cat||'')}</div>
      <div class="gk num">${it.dish?Math.round(it.dish.k*it.dish.g/100):Math.round(it.k)}<small> ккал${it.dish?'':' /100 г'}</small></div>
    </div>`).join('') : `<div class="empty" style="grid-column:1/-1">Пусто. Создай свой продукт или блюдо.</div>`;

  document.querySelectorAll('#flist .gcard').forEach(el=>el.onclick=()=>{
    const it = items[+el.dataset.ix];
    pickMode='day';
    chooseMeal(mi=>openAmount(it, mi, null));
  });
  document.querySelectorAll('#flist [data-ed]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const it = items[+b.dataset.ed];

                   ing:(D.ing||[]).map(x=>Object.assign({},x))};
      openDishForm();

}
function bindFood(){

  document.getElementById('np').onclick = ()=>openProductForm();
  document.getElementById('nd').onclick = ()=>{ dishDraft = {n:'', g:'', k:'', p:'', f:'', c:'', ing:[]}; openDishForm(); };

}

/* ---------- Свой продукт и правка карточек ---------- */
function openProductForm(prod){
  const edit = !!prod, mine = edit && prod.my, base = edit && prod._o;
  const title = !edit ? 'Свой продукт' : (mine ? 'Мой продукт' : 'Продукт из базы');
  const hint = !edit ? 'Значения указывай на 100 г — как на упаковке.'

            : 'Меняй что угодно — значения на 100 г.');
  const v = (x) => (x===undefined||x===null) ? '' : x;

  sheet(`<div class="shead"><h3>${title}</h3><button class="close" data-x>✕</button></div>
    <div class="dsub" style="margin:-6px 0 12px">${hint}</div>
    <div class="field"><label>Название</label>

    <div class="row2">
      <div class="field"><label>Ккал / 100 г</label><input class="input num" id="pk" type="number" inputmode="decimal" value="${edit?v(prod.k):''}"></div>

    </div>
    <div class="row2">
      <div class="field"><label>Жиры</label><input class="input num" id="pf" type="number" inputmode="decimal" value="${edit?v(prod.f):''}"></div>
      <div class="field"><label>Углеводы</label><input class="input num" id="pc" type="number" inputmode="decimal" value="${edit?v(prod.c):''}"></div>
    </div>
    <button class="btn" id="ok">${edit?'Сохранить изменения':'Сохранить продукт'}</button>
    ${mine ? '<button class="btn warn sm" id="del" style="margin-top:9px">Удалить продукт</button>' : ''}
    ${base && prod.edited ? '<button class="btn ghost sm" id="reset" style="margin-top:9px">Вернуть исходные значения</button>' : ''}
    ${base ? '<button class="btn warn sm" id="hide" style="margin-top:9px">Убрать из базы</button>' : ''}
    ${edit ? '<div class="dsub" style="margin-top:12px">Записи, которые уже стоят в дневнике, не пересчитываются — они хранят те цифры, что были на момент записи.</div>' : ''}`);

  document.getElementById('ok').onclick = ()=>{
    const n = document.getElementById('pn').value.trim();
    if(!n){ toast('Нужно название'); return; }
    const num = id => parseFloat(document.getElementById(id).value)||0;
    const data = {n, k:num('pk'), p:num('pp'), f:num('pf'), c:num('pc')};
    if(mine) state.custom[prod.ci] = Object.assign(data, {cat:'Мои продукты'});
    else if(base) state.edits[prod._o] = data;
    else state.custom.unshift(Object.assign(data, {cat:'Мои продукты'}));
    save(); closeSheet(); toast(edit?'Изменения сохранены':'Продукт сохранён'); render();
  };
  const del = document.getElementById('del');
  if(del) del.onclick = ()=>{
    state.custom.splice(prod.ci,1); save(); closeSheet(); toast('Продукт удалён'); render();
  };
  const rs = document.getElementById('reset');
  if(rs) rs.onclick = ()=>{

  };
  const hd = document.getElementById('hide');
  if(hd) hd.onclick = ()=>{
    state.hidden = (state.hidden||[]).concat([prod._o]);
    delete state.edits[prod._o];
    save(); closeSheet(); toast('Убрано из базы'); render();
  };
}

      p:r1(tot.p), f:r1(tot.f), c:r1(tot.c)});

/* ---------- Отчёт ---------- */
let repN = 7;

/* дни выбранного периода — одни и те же для экрана отчёта и для выгрузки файлом */
function reportDays(){
  const out = [];
  for(let i=repN-1;i>=0;i--){
    const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-i);
    const k = keyOf(d), day = state.days[k];
    out.push({d, k, day, t: day?totals(day):{k:0,p:0,f:0,c:0}, water: day?(day.water||0):0, has: !!day});
  }
  return out;
}

function viewReport(){
  const s = state.settings, days = reportDays();
  const filled = days.filter(x=>x.t.k>0);
  const avg = a => filled.length ? a/filled.length : 0;
  const sum = f => filled.reduce((s2,x)=>s2+f(x),0);
  const inNorm = filled.filter(x=>x.t.k<=s.kcal).length;
  const max = Math.max(s.kcal, ...days.map(x=>x.t.k), 1);

  /* вода считается по дням, где она вообще отмечена, даже если еду в тот день не записывала */
  const wDays = days.filter(x=>x.water>0);
  const avgWater = wDays.length ? wDays.reduce((s2,x)=>s2+x.water,0)/wDays.length : 0;

  /* «чаще всего» — только за выбранный период, а не за всё время */
  const counts = {};
  days.forEach(x=>{
    const day = state.days[x.k];
    if(day) day.meals.forEach(m=>m.items.forEach(i=>{ counts[i.n] = (counts[i.n]||0)+1; }));
  });
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);

  return `
  <div class="chips">
    <button class="chip ${repN===7?'on':''}" data-n="7">7 дней</button>
    <button class="chip ${repN===14?'on':''}" data-n="14">14 дней</button>
    <button class="chip ${repN===30?'on':''}" data-n="30">30 дней</button>
  </div>
  <div class="card">
    <div class="mname" style="margin-bottom:8px">Калории по дням</div>
    <div class="chart">
      ${days.map((x,ix)=>{
        const h = Math.round(x.t.k/max*100);
        /* на 30 днях подписи не помещаются — оставляем каждую пятую */
        const lab = (days.length<=14 || ix%5===0) ? x.d.getDate() : '';
        return `<div class="col"><div class="track"><div class="colbar ${x.t.k>s.kcal?'over':''} ${x.t.k===0?'zero':''}"
          style="height:${Math.max(h,2)}%"></div></div><small>${lab||'&nbsp;'}</small></div>`;
      }).join('')}
    </div>
    <div class="dsub" style="margin-top:8px">Красным — дни выше нормы (${s.kcal} ккал).</div>
  </div>
  <div class="stat">
    <div class="sbox"><b class="num">${Math.round(avg(sum(x=>x.t.k)))}</b><span>средние калории</span></div>
    <div class="sbox"><b class="num">${inNorm}/${filled.length||0}</b><span>дней в пределах нормы</span></div>
    <div class="sbox"><b class="num">${Math.round(avg(sum(x=>x.t.p)))} г</b><span>белка в день</span></div>
    <div class="sbox"><b class="num">${(avgWater*s.glass/1000).toFixed(1)} л</b><span>воды в день</span></div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="mname" style="margin-bottom:6px">Средние Б / Ж / У</div>
    <div class="eaten">
      <div class="row"><span class="muted">Белки</span><b class="num">${Math.round(avg(sum(x=>x.t.p)))} г из ${s.p}</b></div>
      <div class="row"><span class="muted">Жиры</span><b class="num">${Math.round(avg(sum(x=>x.t.f)))} г из ${s.f}</b></div>
      <div class="row"><span class="muted">Углеводы</span><b class="num">${Math.round(avg(sum(x=>x.t.c)))} г из ${s.c}</b></div>
    </div>
  </div>
  <div class="card">
    <div class="mname" style="margin-bottom:4px">Что ты ешь чаще всего</div>
    <div class="dsub" style="margin-bottom:6px">За последние ${repN} дней</div>
    ${top.length ? top.map(t=>`<div class="tline"><span>${t[0]}</span><b class="num">${t[1]} раз</b></div>`).join('')
      : '<div class="empty">Пока мало записей — статистика появится через несколько дней.</div>'}
  </div>
  <button class="btn ghost sm" id="expRep" style="margin-bottom:8px">📄 Отчёт файлом — тренеру</button>`;
}
function bindReport(){
  document.querySelectorAll('.chip[data-n]').forEach(b=>b.onclick=()=>{ repN=+b.dataset.n; render(); });
  document.getElementById('expRep').onclick = openExport;
}

/* ---------- Отчёт файлом: человеческий текст, а не выгрузка данных ---------- */
function buildReportText(){
  const s = state.settings, days = reportDays();
  const filled = days.filter(x=>x.t.k>0);
  const avg = f => filled.length ? filled.reduce((a,x)=>a+f(x),0)/filled.length : 0;
  const wD = days.filter(x=>x.water>0);
  const avgW = wD.length ? wD.reduce((a,x)=>a+x.water,0)/wD.length : 0;
  const inNorm = filled.filter(x=>x.t.k<=s.kcal).length;
  const dl = x => x.d.getDate()+' '+MON[x.d.getMonth()];
  const cap = t => t.charAt(0).toUpperCase()+t.slice(1);
  const L = [];

  L.push('ДНЕВНИК ПИТАНИЯ');
  L.push(dl(days[0])+' — '+dl(days[days.length-1])+' '+days[days.length-1].d.getFullYear()+' г.');
  L.push('');
  L.push('Моя норма: '+s.kcal+' ккал, Б '+s.p+' / Ж '+s.f+' / У '+s.c+' г');
  L.push('');

  if(!filled.length){
    L.push('За этот период записей нет.');
    return L.join('\n');
  }

  L.push('В СРЕДНЕМ ЗА '+repN+' ДНЕЙ');
  L.push('Калории: '+Math.round(avg(x=>x.t.k))+' ккал');
  L.push('Белки: '+Math.round(avg(x=>x.t.p))+' г из '+s.p);
  L.push('Жиры: '+Math.round(avg(x=>x.t.f))+' г из '+s.f);
  L.push('Углеводы: '+Math.round(avg(x=>x.t.c))+' г из '+s.c);
  L.push('Вода: '+(avgW*s.glass/1000).toFixed(1)+' л');
  L.push('В норму уложилась: '+inNorm+' из '+filled.length+' дней с записями');
  L.push('');
  L.push('ПО ДНЯМ');

  days.forEach(x=>{
    if(!x.day || x.t.k<=0) return;
    L.push('');
    L.push('--------------------');
    L.push(cap(WD[x.d.getDay()])+', '+dl(x));
    L.push('Итого: '+Math.round(x.t.k)+' ккал'+(x.t.k>s.kcal?' (выше нормы)':'')
      +' | Б '+r1(x.t.p)+' | Ж '+r1(x.t.f)+' | У '+r1(x.t.c)
      +(x.water?' | вода '+(x.water*s.glass/1000).toFixed(2)+' л':''));
    x.day.meals.forEach(m=>{
      if(!m.items.length) return;
      L.push('');
      L.push(m.name+' — '+Math.round(mealKcal(m))+' ккал');
      m.items.forEach(i=>{
        L.push('  • '+i.n+' — '+i.g+' г, '+Math.round(i.k*i.g/100)+' ккал'
          +' (Б '+r1(i.p*i.g/100)+' Ж '+r1(i.f*i.g/100)+' У '+r1(i.c*i.g/100)+')');
      });
    });
  });

  const skipped = days.length - filled.length;
  if(skipped){
    L.push('');
    L.push('--------------------');
    L.push('Дней без записей за период: '+skipped);
  }
  return L.join('\n');
}

function openExport(){
  const txt = buildReportText();
  const days = reportDays();
  const name = 'pitanie-'+days[0].k+'_'+days[days.length-1].k+'.txt';

  sheet(`<div class="shead"><h3>Отчёт файлом</h3><button class="close" data-x>✕</button></div>
    <div class="dsub" style="margin:-6px 0 12px">Обычный текст за ${repN} дней — что ел, сколько и когда.
      Такой файл можно переслать тренеру, он откроется на любом телефоне.</div>
    <textarea class="input" id="rtxt" readonly style="min-height:200px">${txt.replace(/</g,'&lt;')}</textarea>
    <button class="btn" id="dl">Скачать файлом</button>
    <button class="btn ghost sm" id="cp" style="margin-top:9px">Скопировать текст</button>
    <div class="dsub" style="margin-top:12px">Если файл не скачался — так бывает внутри телеграма —
      нажми «Скопировать текст» и вставь его прямо в чат тренеру.</div>`);

  document.getElementById('dl').onclick = ()=>{
    try{
      const blob = new Blob(['﻿'+txt], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      haptic('medium'); toast('Файл сохранён: '+name);
    }catch(e){ toast('Не вышло — скопируй текст'); }
  };

  document.getElementById('cp').onclick = ()=>{
    const ta = document.getElementById('rtxt');
    const old = ()=>{
      ta.removeAttribute('readonly'); ta.focus(); ta.select(); ta.setSelectionRange(0, 999999);
      let ok = false;
      try{ ok = document.execCommand('copy'); }catch(e){}
      ta.setAttribute('readonly','');
      if(ok){ ta.blur(); toast('Текст скопирован'); }
      else { toast('Текст выделен — нажми «Копировать»'); }   /* выделение оставляем */
    };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(()=>{ haptic('medium'); toast('Текст скопирован'); }, old);
      } else old();
    }catch(e){ try{ old(); }catch(x){ toast('Выдели текст и скопируй вручную'); } }
  };
}

/* ---------- Настройки ---------- */
function viewSet(){
  const s = state.settings;
  return `
  <div class="card">
    <div class="mname" style="margin-bottom:10px">Моя дневная норма</div>
    <div class="row2">
      <div class="field"><label>Калории</label><input class="input num" id="s_kcal" type="number" value="${s.kcal}"></div>
      <div class="field"><label>Белки, г</label><input class="input num" id="s_p" type="number" value="${s.p}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Жиры, г</label><input class="input num" id="s_f" type="number" value="${s.f}"></div>
      <div class="field"><label>Углеводы, г</label><input class="input num" id="s_c" type="number" value="${s.c}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Стакан воды, мл</label><input class="input num" id="s_glass" type="number" value="${s.glass}"></div>
      <div class="field"><label>Стаканов в день</label><input class="input num" id="s_wg" type="number" value="${s.waterGoal}"></div>
    </div>
    <div class="field"><label>Приёмы пищи по умолчанию (через запятую)</label>
      <input class="input" id="s_meals" value="${s.meals.join(', ')}"></div>
    <button class="btn" id="saveSet">Сохранить</button>
  </div>

  <div class="card">
    <div class="mname" style="margin-bottom:8px">Цвет приложения</div>
    <div class="chips" id="pals">
      <button class="chip ${s.pal==='lavender'?'on':''}" data-p="lavender">Лаванда</button>
      <button class="chip ${s.pal==='green'?'on':''}" data-p="green">Зелень</button>
      <button class="chip ${s.pal==='sunset'?'on':''}" data-p="sunset">Закат</button>
    </div>
    <div class="mname" style="margin:12px 0 8px">Фон</div>
    <div class="chips" id="thms">
      <button class="chip ${s.theme==='light'?'on':''}" data-th="light">Светлый</button>
      <button class="chip ${s.theme==='dark'?'on':''}" data-th="dark">Тёмный</button>
    </div>
  </div>

  <div class="card">
    <div class="mname" style="margin-bottom:4px">Копия данных</div>
    <div class="dsub" style="margin-bottom:10px">Записи хранятся в памяти приложения. Раз в неделю делай копию — тогда ничего не потеряется.</div>
    ${CLOUD ? `<div class="row2" style="margin-bottom:10px">
      <button class="btn ghost sm" id="bkCloud">Копия в Telegram</button>
      <button class="btn ghost sm" id="rsCloud">Восстановить</button>
    </div>` : `<div class="dsub" style="margin-bottom:10px">Копия в облако телеграма появится, если открыть приложение через бота, а не в браузере.</div>`}
    <div class="row2">
      <button class="btn ghost sm" id="expFile">Сохранить копию</button>
      <button class="btn ghost sm" id="impFile">Вернуть из копии</button>
    </div>
    <input type="file" id="fileIn" accept="application/json" style="display:none">
    <div class="dsub" style="margin-top:10px">Это служебный файл для переноса на другой телефон — внутри
      непонятный текст, и это нормально. Отчёт, который можно показать человеку, лежит на вкладке
      «Отчёт», кнопка внизу.</div>
  </div>

  ${(state.hidden&&state.hidden.length)?`<div class="card">
    <div class="mname" style="margin-bottom:4px">Убранные продукты</div>
    <div class="dsub" style="margin-bottom:10px">Из базы скрыто: ${state.hidden.length}. Можно вернуть все разом.</div>
    <button class="btn ghost sm" id="unhide">Вернуть в базу</button>
  </div>`:''}

  <div class="card">
    <div class="mname" style="margin-bottom:4px">Очистить</div>
    <div class="dsub" style="margin-bottom:10px">Удалит все записи, продукты и блюда без возможности вернуть.</div>
    <button class="btn warn sm" id="wipe">Удалить все данные</button>
  </div>
  <div class="dsub" style="text-align:center;padding:2px 0 10px">
    В базе ${DB.length} продуктов, значения справочные и усреднённые.
  </div>`;
}
function bindSet(){
  document.getElementById('saveSet').onclick = ()=>{
    const v = id => parseFloat(document.getElementById(id).value)||0;
    const s = state.settings;
    s.kcal = v('s_kcal')||s.kcal; s.p = v('s_p'); s.f = v('s_f'); s.c = v('s_c');
    s.glass = v('s_glass')||250; s.waterGoal = v('s_wg')||8;
    const m = document.getElementById('s_meals').value.split(',').map(x=>x.trim()).filter(Boolean);
    if(m.length) s.meals = m;
    save(); toast('Сохранено'); render();
  };
  document.querySelectorAll('#pals .chip').forEach(b=>b.onclick=()=>{
    state.settings.pal = b.dataset.p; applyTheme(); save();
    document.querySelectorAll('#pals .chip').forEach(x=>x.classList.toggle('on', x.dataset.p===state.settings.pal));
  });
  document.querySelectorAll('#thms .chip').forEach(b=>b.onclick=()=>{
    state.settings.theme = b.dataset.th; applyTheme(); save();
    document.querySelectorAll('#thms .chip').forEach(x=>x.classList.toggle('on', x.dataset.th===state.settings.theme));
  });
  const uh = document.getElementById('unhide');
  if(uh) uh.onclick = ()=>{ state.hidden = []; save(); toast('Продукты вернулись в базу'); render(); };
  if(CLOUD){
    document.getElementById('bkCloud').onclick = ()=>cloudBackup(ok=>toast(ok?'Копия сохранена в Telegram':'Облако недоступно'));
    document.getElementById('rsCloud').onclick = ()=>cloudRestore();
  }
  document.getElementById('expFile').onclick = ()=>{
    const blob = new Blob([JSON.stringify(state)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kopiya-dnevnika-'+keyOf(new Date())+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast('Копия сохранена файлом');
  };
  const fi = document.getElementById('fileIn');
  document.getElementById('impFile').onclick = ()=>fi.click();
  fi.onchange = ()=>{
    const f = fi.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{ try{ state = JSON.parse(rd.result); save(); applyTheme(); render(); toast('Данные загружены'); }
                      catch(e){ toast('Файл не читается'); } };
    rd.readAsText(f);
  };
  document.getElementById('wipe').onclick = ()=>{
    sheet(`<div class="shead"><h3>Удалить все данные?</h3><button class="close" data-x>✕</button></div>
      <div class="dsub" style="margin-bottom:14px">Дневник, свои продукты и блюда исчезнут. Вернуть будет нельзя.</div>
      <button class="btn warn" id="yes">Да, удалить</button>
      <button class="btn ghost sm" id="no" style="margin-top:9px">Отмена</button>`);
    document.getElementById('yes').onclick = ()=>{
      state = JSON.parse(JSON.stringify(DEFAULT)); save(); applyTheme(); closeSheet(); render(); toast('Всё очищено');
    };
    document.getElementById('no').onclick = closeSheet;
  };
}

/* ---------- Шторка ---------- */
function sheet(html){
  const w = document.getElementById('swrap'), s = document.getElementById('sheet');
  s.innerHTML = '<div class="grab"></div>'+html;
  w.classList.add('on');
  s.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeSheet);
}
function closeSheet(){ document.getElementById('swrap').classList.remove('on'); }
document.getElementById('swrap').onclick = e=>{ if(e.target.id==='swrap') closeSheet(); };

applyTheme();
render();

/* первый запуск на новом телефоне: молча поднимаем копию из облака телеграма */
if(FRESH && CLOUD) cloudRestore(true);
</script>
